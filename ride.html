<title>Redline Riders</title>
<!--
  /ride = a nevjegykartya QR-kodjanak celja (2026-10-30; elotte /card).
  MIERT NEM /card: a gyanakvo vevo a "card" szot a bankkartyajaval kotne ossze -> nem nyitja meg (Zsolt).
  MIERT KULON OLDAL: a kinyomtatott QR nem modosithato; ha a kod vagy a celoldal valtozik
  (pl. PRIVAT15 -> PRIVAT10), csak a CEL sort + a refresh sort + a tartalek linket kell atirni, a kartyak maradnak.
  A Shopify /discount/ link automatikusan rarakja a kodot (cookie-elutasitassal is mukodik, 10-30 merve).
  UTM: utm_source=qr, utm_medium=visitenkarte (lathato a cimsorban, ezert nem "card").
  KESOBB (TODO): sajat szkenneles-szamlalo (Supabase), mert az Analytics csak cookie-elfogadasnal szamol.
-->
<script>
  var CEL = "https://shop.redlineriders.com/discount/PRIVAT15?redirect=/collections/all-apparel&utm_source=qr&utm_medium=visitenkarte&utm_campaign=privat15";
  location.replace(CEL);
</script>
<meta http-equiv="refresh" content="0;url=https://shop.redlineriders.com/discount/PRIVAT15?redirect=/collections/all-apparel&utm_source=qr&utm_medium=visitenkarte&utm_campaign=privat15">
